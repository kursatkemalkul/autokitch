<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1320" width="1500" height="1320"><rect width="1500" height="1320" fill="#ffffff"/><text x="110.0" y="54.0" text-anchor="start" font-size="17" fill="#111" font-family="Arial" font-weight="bold">İSTASYON 3 — TOPPING · DETAY ÇİZİMİ v1</text><text x="110.0" y="78.0" text-anchor="start" font-size="11" fill="#555" font-family="Arial">Mevcut karar (konsept A — dozaj kulesi): 3 soğutmalı hazne + döner tabla. DOZAJ MEKANİZMASI AÇIK — piyasa araştırması sürüyor.</text><text x="110.0" y="96.0" text-anchor="start" font-size="11" fill="#555" font-family="Arial">Günlük: kaşar ~6,5 kg · sucuk ~1,3 kg (8-10 dilim/pide) · kavurma ~1,2 kg — hazneler 2-3 günlük, ELEMAN doldurur</text><text x="285.0" y="132.0" text-anchor="middle" font-size="12.5" fill="#111" font-family="Arial" font-weight="bold">ÖN GÖRÜNÜŞ (robot tarafı)</text><rect x="110.0" y="150.0" width="350.0" height="925.0" rx="5" fill="none" stroke="#111" stroke-width="2.2"/><rect x="122.0" y="1075.0" width="12.0" height="60.0" rx="0" fill="none" stroke="#111" stroke-width="1.4"/><rect x="436.0" y="1075.0" width="12.0" height="60.0" rx="0" fill="none" stroke="#111" stroke-width="1.4"/><line x1="70.0" y1="1135.0" x2="500.0" y2="1135.0" stroke="#111" stroke-width="2"/><rect x="122.5" y="185.0" width="325.0" height="380.0" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="285.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#111" font-family="Arial" font-weight="bold">HAZNE BÖLGESİ — soğutmalı +3 °C</text><rect x="225.0" y="230.0" width="120.0" height="150.0" rx="3" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="5,4"/><line x1="225.0" y1="380.0" x2="265.0" y2="430.0" stroke="#777" stroke-width="1.1" stroke-dasharray="5,4"/><line x1="345.0" y1="380.0" x2="305.0" y2="430.0" stroke="#777" stroke-width="1.1" stroke-dasharray="5,4"/><text x="285.0" y="310.0" text-anchor="middle" font-size="10" fill="#555" font-family="Arial">H3 KAVURMA</text