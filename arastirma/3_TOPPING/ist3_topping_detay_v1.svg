ext x="1180.0" y="160.0" text-anchor="start" font-size="12.5" fill="#111" font-family="Arial" font-weight="bold">DURUM:</text><text x="1180.0" y="184.0" text-anchor="start" font-size="10.5" fill="#333" font-family="Arial">· Menü: kaşarlı · sucuklu ·</text><text x="1180.0" y="204.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  kavurmalı · karışık</text><text x="1180.0" y="224.0" text-anchor="start" font-size="10.5" fill="#333" font-family="Arial">· Miktarlar (pide başına):</text><text x="1180.0" y="244.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  kaşar ~80 g · sucuk 8-10 dilim</text><text x="1180.0" y="264.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  · kavurma ~60 g</text><text x="1180.0" y="284.0" text-anchor="start" font-size="10.5" fill="#333" font-family="Arial">· Hazneler soğutmalı +3 °C:</text><text x="1180.0" y="304.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  kaşar rende 2-3 hafta dayanır,</text><text x="1180.0" y="324.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  sucuk vakumlu, kavurma küvetten</text><text x="1180.0" y="344.0" text-anchor="start" font-size="10.5" fill="#333" font-family="Arial">· Dolum: ELEMAN (dükkânda hep var)</text><text x="1180.0" y="364.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  hazne 2-3 günlük, küvetten takviye</text><text x="1180.0" y="384.0" text-anchor="start" font-size="10.5" fill="#333" font-family="Arial">· Pide DÖNER TABLADA döner —</text><text x="1180.0" y="404.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  malzeme sabit noktadan yağar</text><text x="1180.0" y="424.0" text-anchor="start" font-size="10.5" fill="#b3452b" font-family="Arial" font-weight="bold">· AÇIK: dozaj mekanizmaları</text><text x="1180.0" y="444.0" text-anchor="start" font-size="10.5" fill="#b3452b" font-family="Arial">  (kaşar/sucuk/kavurma) —</text><text x="1180.0" y="464.0" text-anchor="start" font-size="10.5" fill="#b3452b" font-family="Arial">  piyasa araştırması SÜRÜYOR;</text><text x="1180.0" y="484.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  hazır sistem bulunursa bu</text><text x="1180.0" y="504.0" text-anchor="start" font-size="10.5" fill="#666" font-family="Arial">  çizim ona göre revize edilir</text><text x="1476.0" y="1306.0" text-anchor="end" font-size="10" fill="#999" font-family="Arial">AUTOKITCH · ist3_topping_detay_v1</text></svg>