ext x="910.0" y="400.0" font-family="Arial" font-size="13" fill="#333" font-weight="normal" text-anchor="start">Dış ≈ 32 × 32 × 4,5 cm (iç Ø30 tabana uygun).</text><text x="910.0" y="420.0" font-family="Arial" font-size="13" fill="#333" font-weight="normal" text-anchor="start">Kapak tek hareketle kapanır (eğik sac ile).</text><text x="910.0" y="440.0" font-family="Arial" font-size="12" fill="#666" font-weight="normal" text-anchor="start">Outside ≈ 32×32×4.5 cm; lid closes in one motion.</text><line x1="30.0" y1="500.0" x2="1220.0" y2="500.0" stroke="#999" stroke-width="1.0"/><text x="30.0" y="528.0" font-family="Arial" font-size="15" fill="#1a1a1a" font-weight="bold" text-anchor="start">ŞARTLAR / REQUIREMENTS:</text><text x="30.0" y="554.0" font-family="Arial" font-size="13" fill="#333" font-weight="normal" text-anchor="start">· Gıda temasına uygun karton veya E-flüt oluklu (sıcak ürün ~90 °C) / food-grade board or E-flute, hot food safe</text><text x="30.0" y="576.0" font-family="Arial" font-size="13" fill="#333" font-weight="normal" text-anchor="start">· Kurulum İNSANSIZ — otomatik makinenin içindeki basit düzenek kuracak / erected UNMANNED inside a vending machine</text><text x="30.0" y="598.0" font-family="Arial" font-size="13" fill="#333" font-weight="normal" text-anchor="start">· Çok adımlı klasik kilitli pizza kutusu UYGUN DEĞİL / classic multi-step lock-corner pizza box is NOT suitable</text><text x="1220.0" y="598.0" font-family="Arial" font-size="11" fill="#999" font-weight="normal" text-anchor="end">AUTOKITCH · kutu_talep_semasi_v1</text></svg>