ereceğiniz kutuya/ölçüye uyarız</text><text x="620.0" y="420.4" font-family="Arial" font-size="15.0" fill="#1a1a1a" font-weight="bold" text-anchor="start">İSTEK / REQUEST:</text><text x="620.0" y="446.4" font-family="Arial" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start">· Haftalık ~560 kutu (günde ~80 · tepe saatte ~12)</text><text x="620.0" y="468.4" font-family="Arial" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start">· Kutular açık hâlde sistemin İÇİNDE istifli duracak</text><text x="620.0" y="490.4" font-family="Arial" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="start">· Komut gelince (24V sinyal / PLC) TEK kutu katlayacak</text><text x="620.0" y="512.4" font-family="Arial" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="start">· KATLAMA YÖNTEMİ SİZE AİT — çıktı: katlanmış kutu</text><text x="620.0" y="534.4" font-family="Arial" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start">· Sürekli çalışmaz — sanayi tipi büyük makine aramıyoruz</text><text x="620.0" y="556.4" font-family="Arial" font-size="12.0" fill="#555" font-weight="normal" text-anchor="start">· Tüm ölçüler yaklaşık — öneriniz değerlidir</text><text x="620.0" y="590.4" font-family="Arial" font-size="10.5" fill="#888" font-weight="normal" text-anchor="start">EN: ~560 flat blanks/week stored inside; on command it folds ONE box;</text><text x="620.0" y="605.4" font-family="Arial" font-size="10.5" fill="#888" font-weight="normal" text-anchor="start">folding method is up to you — we only need the folded box; not continuous.</text><text x="1030.0" y="784.0" font-family="Arial" font-size="11.0" fill="#999" font-weight="normal" text-anchor="end">AUTOKITCH · kutu_istasyonu_teknik_v3</text></svg>