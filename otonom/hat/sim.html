<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPPING — canlı simülasyon</title><link rel="stylesheet" href="hat.css?v=9">
<style>
body{overflow:hidden}
.sim{position:fixed;inset:0;top:45px;display:grid;grid-template-columns:1fr 440px;background:#11141a}
.sahne{position:relative;background:#11141a}
.sahne canvas{display:block}
.hud{position:absolute;left:16px;top:14px;color:#9aa4b2;font-size:12px;line-height:1.7;pointer-events:none;font-variant-numeric:tabular-nums}
.hud b{color:#e6ecf3;font-weight:600}
.hud .on{color:#6ee7a0}
.panel{background:#171b22;border-left:1px solid #262c36;display:flex;flex-direction:column;overflow:hidden}
.panel h3{margin:0;padding:13px 16px 10px;color:#8d97a4;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;border-bottom:1px solid #222831}
.urun{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px}
.urun button{flex:1 1 calc(50% - 4px);padding:9px 8px;border:1px solid #2e3541;border-radius:9px;background:#1f242d;color:#c3cad3;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.urun button:hover{border-color:#4a5563;color:#eef2f6}
.urun button.on{border-color:#4f86ff;background:#26344d;color:#dce8ff}
.calis{display:flex;gap:8px;padding:0 16px 12px}
.calis button{flex:1;padding:11px;border:0;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.calis .bas{background:#2f7d4f;color:#fff}.calis .bas:disabled{background:#2a3038;color:#69727e;cursor:default}
.calis .dur{background:#7d2f2f;color:#fff}
.durum{padding:0 16px 12px;color:#9aa4b2;font-size:12.5px;line-height:1.85;font-variant-numeric:tabular-nums}
.durum .sat{display:flex;justify-content:space-between;border-bottom:1px solid #1e242c;padding:3px 0}
.durum .sat b{color:#e6ecf3;font-weight:600}
.mot{display:flex;flex-wrap:wrap;gap:5px;padding:2px 16px 12px}
.mot span{padding:3px 8px;border-radius:6px;background:#1f242d;color:#69727e;font-size:11px;border:1px solid #262c36}
.mot span.on{background:#1b3a28;color:#6ee7a0;border-color:#2f6b45}
.kod{flex:1;overflow:auto;background:#0f1319;border-top:1px solid #222831;padding:8px 0 40px}
.kod pre{margin:0;font:11.5px/1.55 "SF Mono",Menlo,Consolas,monospace;color:#7d8794;white-space:pre}
.kod .l{display:block;padding:0 16px}
.kod .l.ak{background:#1d2f4d;color:#cfe0ff}
.kod .l.ak::before{content:"▶ ";color:#4f86ff;margin-left:-14px}
.log{height:132px;overflow:auto;border-top:1px solid #222831;padding:8px 16px;font:11.5px/1.7 "SF Mono",Menlo,Consolas,monospace;color:#8d97a4}
.log div{white-space:pre-wrap}.log .y{color:#6ee7a0}.log .b{color:#dce8ff}
@media (max-width:900px){.sim{grid-template-columns:1fr;grid-template-rows:46vh 1fr}.panel{border-left:0;border-top:1px solid #262c36}}
</style></head><body>
<div class="top"><div class="in"><div class="crumb"><a href="../">Store</a><span>&rsaquo;</span><a href="index.html">HAT</a><span>&rsaquo;</span><a href="topping.html">3 · TOPPING</a><span>&rsaquo;</span><b>Canlı simülasyon</b></div><div><a href="topping.html">&larr; TOPPING</a></div></div></div>

<div class="sim">
  <div class="sahne" id="sahne">
    <div class="hud" id="hud">yükleniyor…</div>
  </div>
  <div class="panel">
    <h3>1 · Ürün seç</h3>
    <div class="urun" id="urun"></div>
    <div class="calis">
      <button class="bas" id="bas">BAŞLAT</button>
      <button class="dur" id="dur">DUR</button>
    </div>
    <h3>2 · Makine durumu</h3>
    <div class="durum" id="durum"></div>
    <div class="mot" id="mot"></div>
    <h3>3 · Çalışan kod — makine_kodu.js</h3>
    <div class="kod" id="kod"><pre></pre></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as K from './makine_kodu.js?v=2';

const MM = 0.001;                                     // model metre, makine tanımı mm
const el = i => document.getElementById(i);
const log = (t, s) => { const d = document.createElement('div'); d.className = s || ''; d.textContent = t; el('log').appendChild(d); el('log').scrollTop = 1e6; };

// ───────────────────────────────── sahne
const sahne = new THREE.Scene(); sahne.background = new THREE.Color(0x11141a);
const kam = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(2, devicePixelRatio));
el('sahne').appendChild(ren.domElement);
const kon = new OrbitControls(kam, ren.domElement);
sahne.add(new THREE.HemisphereLight(0xdfe7f2, 0x2a2f38, 1.15));
const gun = new THREE.DirectionalLight(0xffffff, 1.0); gun.position.set(1.4, 2.2, 1.6); sahne.add(gun);
const gun2 = new THREE.DirectionalLight(0xffffff, 0.35); gun2.position.set(-1.2, 1.0, -1.4); sahne.add(gun2);

function boyut() {
  const r = el('sahne').getBoundingClientRect();
  kam.aspect = r.width / r.height; kam.updateProjectionMatrix(); ren.setSize(r.width, r.height);
}
addEventListener('resize', boyut);

// ───────────────────────────────── makine tanımı + model
const M = await (await fetch('../hat3d/sim_makine.json?v=1')).json();
K.kur(M, izle);

const glb = await new GLTFLoader().loadAsync('../hat3d/sim_topping_v1.glb?v=1');
const kok = glb.scene;
const G = {};
kok.traverse(o => { if (o.name && !o.name.includes('.')) G[o.name] = o; });

// pivot kurulumu: bir grubu verilen noktanın etrafında döndürebilmek için araya taşıyıcı koyarız
function pivotla(obj, p) {
  const t = new THREE.Group();
  t.position.set(p[0] * MM, p[1] * MM, p[2] * MM);
  obj.position.set(-p[0] * MM, -p[1] * MM, -p[2] * MM);
  kok.add(t); t.add(obj);
  return t;
}

// ARABA paketi: x'te kayan her şey tek taşıyıcıda
const ARABA = new THREE.Group(); kok.add(ARABA);
const TABLA_P = M.tabla.pivot;
const TABLA = pivotla(G.TABLA, TABLA_P); ARABA.add(TABLA);
const TEPSI = pivotla(G.TEPSI, TABLA_P); ARABA.add(TEPSI);
const PIDE = pivotla(G.PIDE, TABLA_P); ARABA.add(PIDE);
ARABA.add(G.ARABA);

// kaset milleri: z ekseninde dönerler
const MILLER = {};
for (const y of M.yuvalar) {
  for (const [ad, kot] of [['HELEZON', y.mil_helezon_y], ['KARISTIRICI', y.mil_karistirici_y]]) {
    const g = G[ad + '_' + y.kod];
    if (g) MILLER[ad + '_' + y.kod] = pivotla(g, [y.x, kot, 0]);
  }
}

sahne.add(kok);
// Kamera tabla bölgesine bakar; TAKİP açıkken araba ile birlikte kayar (kullanıcı kapatabilir).
const TBY = M.pide.ust_y * MM, TBZ = M.tabla.eksen_z * MM;
kon.target.set(M.tabla.baslangic_x * MM, TBY + 0.20, TBZ - 0.10);
kam.position.set(M.tabla.baslangic_x * MM + 0.75, TBY + 0.95, TBZ + 2.30);
kon.update(); boyut();
let TAKIP = true;
addEventListener('keydown', e => { if (e.key === 't') { TAKIP = !TAKIP; log('kamera takibi ' + (TAKIP ? 'AÇIK' : 'kapalı'), 'b'); } });
log('model yüklendi · ' + Object.keys(G).length + ' hareketli grup', 'b');

// ───────────────────────────────── kod paneli
const kaynak = await (await fetch('./makine_kodu.js?v=2')).text();
const satirlar = kaynak.split('\n');
const ISARET = {};
satirlar.forEach((s, i) => { const m = s.match(/\/\*@(\w+)\*\//); if (m) ISARET[m[1]] = i; });
el('kod').querySelector('pre').innerHTML = satirlar.map((s, i) =>
  `<span class="l" data-i="${i}">${s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) || ' '}</span>`).join('');

let sonSatir = null;
function vurgula(ad) {
  const i = ISARET[ad]; if (i === undefined) return;
  if (sonSatir !== null) el('kod').querySelector(`[data-i="${sonSatir}"]`)?.classList.remove('ak');
  const e = el('kod').querySelector(`[data-i="${i + 1}"]`) || el('kod').querySelector(`[data-i="${i}"]`);
  if (e) { e.classList.add('ak'); sonSatir = +e.dataset.i; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

function izle(o) {
  if (o.satir) vurgula(o.satir);
  if (o.mesaj) log(o.mesaj, o.faz === 'bitti' ? 'y' : (o.faz === 'basla' ? 'b' : ''));
}

// ───────────────────────────────── ürün düğmeleri
let secili = [];
const kutular = document.createDocumentFragment();
for (const [k, r] of Object.entries(K.RECETE)) {
  const b = document.createElement('button'); b.textContent = r.ad; b.dataset.k = k;
  b.onclick = () => { secili = r.adim.slice(); document.querySelectorAll('.urun button').forEach(x => x.classList.toggle('on', x === b)); log('seçildi: ' + r.ad + ' → ' + r.adim.join(' + '), 'b'); };
  kutular.appendChild(b);
}
el('urun').appendChild(kutular);
document.querySelector('.urun button').click();

el('bas').onclick = async () => {
  if (!secili.length) return;
  el('bas').disabled = true;
  try { await K.urunYap(secili); } finally { el('bas').disabled = false; }
};
el('dur').onclick = () => { K.durdur(); log('DUR basıldı', 'b'); };

// ───────────────────────────────── kare döngüsü
const MOTADLAR = ['X', 'TABLA', ...M.yuvalar.flatMap(y => [(y.pompa ? 'POMPA_' : 'HELEZON_') + y.kod, 'KARISTIRICI_' + y.kod])];
el('mot').innerHTML = MOTADLAR.map(a => `<span data-m="${a}">${a.replace('_', ' ')}</span>`).join('');

let onceki = performance.now();
function kare() {
  const t = performance.now(), dt = Math.min(0.05, (t - onceki) / 1000); onceki = t;
  K.kareIsle(dt);

  ARABA.position.x = (K.EKSEN.X - M.tabla.baslangic_x) * MM;
  const a = THREE.MathUtils.degToRad(K.EKSEN.TABLA);
  TABLA.rotation.y = a; TEPSI.rotation.y = a; PIDE.rotation.y = a;
  for (const ad in MILLER) { const m = K.MOTOR[ad] || K.MOTOR[ad.replace('HELEZON_', 'POMPA_')]; if (m) MILLER[ad].rotation.z = THREE.MathUtils.degToRad(m.aci || 0); }

  const y = M.yuvalar.reduce((p, v) => Math.abs(v.x - K.EKSEN.X) < Math.abs(p.x - K.EKSEN.X) ? v : p);
  const r = Math.sqrt(Math.pow(y.x - K.EKSEN.X, 2) + Math.pow(M.tabla.r_ic, 2));
  el('hud').innerHTML =
    `<b>X</b> ${K.EKSEN.X.toFixed(1)} mm &nbsp; <b>tabla</b> ${K.EKSEN.TABLA.toFixed(0)}°<br>` +
    `en yakın yuva: <b>${y.urun}</b> (x ${y.x})<br>` +
    `ağız → pide merkezi: <b>${r.toFixed(1)} mm</b>` +
    (K.MOTOR.TABLA ? '<br><span class="on">● dozaj sürüyor</span>' : '');
  el('durum').innerHTML =
    `<div class="sat"><span>X ekseni</span><b>${K.EKSEN.X.toFixed(2)} mm</b></div>` +
    `<div class="sat"><span>tabla açısı</span><b>${K.EKSEN.TABLA.toFixed(1)}°</b></div>` +
    `<div class="sat"><span>ağız → pide merkezi (r)</span><b>${r.toFixed(1)} mm</b></div>` +
    `<div class="sat"><span>strok</span><b>${M.tabla.strok[0]} … ${M.tabla.strok[1]} mm</b></div>` +
    `<div class="sat"><span>tabla devri</span><b>${M.tabla.rpm} dev/dk</b></div>` +
    `<div class="sat"><span>doz süresi</span><b>${M.tabla.doz_sn} s</b></div>`;
  document.querySelectorAll('.mot span').forEach(s => s.classList.toggle('on', !!K.MOTOR[s.dataset.m]));

  if (TAKIP) {                                     // kamera arabayı takip eder, bakış açısı korunur
    const hx = K.EKSEN.X * MM, dx = hx - kon.target.x;
    if (Math.abs(dx) > 1e-5) { kon.target.x += dx * Math.min(1, dt * 6); kam.position.x += dx * Math.min(1, dt * 6); }
  }
  kon.update(); ren.render(sahne, kam); requestAnimationFrame(kare);
}
kare();
log('hazır — ürün seçip BAŞLAT', 'y');
</script>
</body></html>
